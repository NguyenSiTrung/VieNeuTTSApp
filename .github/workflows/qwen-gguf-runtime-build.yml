# Qwen GGUF native runtime pack build — OPT-IN (Phase 1 Task 1.2).
#
# Builds the per-cell qwentts.cpp shared-library packs described by
# packaging/qwen-gguf-runtime-requirements.json at the pinned upstream commits,
# stages each pack (runtime libs + ggml backend modules + bundled OpenMP +
# license notices + BUILD-INFO.json), verifies the inventory, runs a symbol
# smoke (ctypes dlopen + qt_version — no model), locks the pack into a
# digest/size manifest, and uploads both as workflow artifacts.
#
# Publication is gated behind the explicit `publish` dispatch input: the
# publish job re-locks each built pack, regenerates the shipped manifest via
# scripts/render_qwen_gguf_runtime_manifests.py, pushes the pack files to the
# gh-pages branch (served by GitHub Pages at downloads_base), and commits the
# regenerated manifests back to main. Nothing here reaches the frozen base
# bundle or the app's dependency lock.
#
# Notes:
# - GitHub-hosted runners have no GPU: the CUDA cells run on self-hosted
#   runners carrying the `cuda` label. Select cells through the `cells` input;
#   an unselected cell never creates a job, so the default dispatch never
#   waits on a GPU runner that is not online.
# - The backend modules are discovered relative to the pack directory: the
#   smoke step runs with the pack as cwd, matching the host contract.

name: Qwen GGUF runtime build (opt-in)

on:
  workflow_dispatch:
    inputs:
      cells:
        description: "Comma-separated cells to build"
        default: "windows-x64-cpu,linux-x64-cpu,macos-arm64-cpu"
        type: string
      publish:
        description: "After building: relock packs, regenerate shipped manifests, push packs to gh-pages and manifest updates to main"
        default: false
        type: boolean
      downloads_base:
        description: "Published packs base URL written into each cell's downloads[]"
        default: "https://nguyensitrung.github.io/VieNeuTTSApp/packs"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          req = json.load(open("packaging/qwen-gguf-runtime-requirements.json"))
          wanted = {c.strip() for c in os.environ["CELLS"].split(",") if c.strip()}
          cells = [c for c in req["cells"] if c["key"] in wanted]
          missing = wanted - {c["key"] for c in cells}
          if missing:
              raise SystemExit(f"unknown cells: {sorted(missing)}")
          print("matrix=" + json.dumps({"include": [
              {"key": c["key"], "os": c["os"], "device": c["device"],
               "runner": c["runner"]} for c in cells
          ]}))
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux build tools (patchelf)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Clone + build + stage the pack
        shell: bash
        run: |
          python scripts/build_qwen_gguf_runtime.py \
            --cell "${{ matrix.key }}" \
            --clone-dir "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/qwen-gguf-pack-${{ matrix.key }}"

      - name: Symbol smoke — dlopen the pack, print qt_version
        shell: bash
        working-directory: ${{ runner.temp }}/qwen-gguf-pack-${{ matrix.key }}
        run: |
          PACK="$RUNNER_TEMP/qwen-gguf-pack-${{ matrix.key }}"
          case "${{ matrix.os }}" in
            windows) LIB="$PACK/qwen.dll" ;;
            macos)   LIB="$PACK/libqwen.dylib" ;;
            *)       LIB="$PACK/libqwen.so" ;;
          esac
          python - "$LIB" <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.qt_version.restype = ctypes.c_char_p
          print("qt_version:", lib.qt_version().decode())
          PY

      - name: Lock the pack manifest
        shell: bash
        run: |
          python scripts/lock_qwen_gguf_runtime.py \
            --pack "$RUNNER_TEMP/qwen-gguf-pack-${{ matrix.key }}" \
            --cell "${{ matrix.key }}" \
            --manifests "$RUNNER_TEMP/qwen-gguf-pack-manifests.json"

      - name: Upload pack + manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwen-gguf-pack-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/qwen-gguf-pack-${{ matrix.key }}
            ${{ runner.temp }}/qwen-gguf-pack-manifests.json
          compression-level: 9

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          pattern: qwen-gguf-pack-*
          path: artifacts

      - name: Collect packs, re-lock, render shipped manifests
        run: |
          set -euo pipefail
          mkdir -p packs
          for d in artifacts/qwen-gguf-pack-*/; do
            cell="$(basename "$d")"; cell="${cell#qwen-gguf-pack-}"
            mv -f "$d/qwen-gguf-pack-$cell" "packs/$cell"
          done
          cells="$(ls packs)"
          for cell in $cells; do
            python scripts/lock_qwen_gguf_runtime.py \
              --pack "packs/$cell" --cell "$cell"
          done
          python scripts/render_qwen_gguf_runtime_manifests.py \
            --packs-dir packs \
            --cells "$(echo "$cells" | tr '\n' ',' | sed 's/,$//')" \
            --downloads-base "${{ inputs.downloads_base }}"

      - name: Publish packs to gh-pages
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          git worktree add --detach pages-worktree FETCH_HEAD
          for d in packs/*/; do
            cell="$(basename "$d")"
            mkdir -p "pages-worktree/packs/$cell"
            (cd "packs/$cell" && find . -type f -print0 | tar --null -T - -cf -) \
              | tar -xf - -C "pages-worktree/packs/$cell"
          done
          cd pages-worktree
          {
            printf '<!doctype html><meta charset="utf-8"><title>VieNeuTTSApp qwen-gguf packs</title>\n'
            printf '<h1>qwen-gguf runtime packs</h1><ul>\n'
            find packs -type f | sort | sed 's|.*|<li><a href="&">&</a></li>|'
            printf '</ul>\n'
          } > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packs index.html
          git commit -m "Publish qwen-gguf packs: $(cd ../packs && ls | tr '\n' ' ')" \
            || echo "no changes to publish"
          git push origin HEAD:gh-pages

      - name: Commit regenerated manifests to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/qwen-gguf-pack-manifests.json \
                  src/vienetts_app/core/qwen_gguf_runtime_manifests.json
          git commit -m "chore(gguf): lock and ship CI-built runtime packs" \
            || echo "no manifest changes"
          git push origin HEAD:main
