[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vienetts-app"
version = "0.1.0"
description = "Cross-platform on-device Vietnamese/English TTS desktop app powered by VieNeu-TTS v3 Turbo"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "VieNeuTTS App contributors" }]
dependencies = [
    "vieneu==3.3.0",
    "PySide6>=6.7",
    "platformdirs>=4",
    "python-docx>=1.1",
    "pypdf>=6",  # MIT (PDF import) — chosen over AGPL PyMuPDF at Phase 0 (spike-report §7)
]

[project.optional-dependencies]
# NVIDIA CUDA build only (torch cu128); CPU build stays torch-free (NFR-1).
gpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
vienetts-app = "vienetts_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vienetts_app"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".agents", ".beads", "conductor", "scripts/spike", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/vienetts_app"]
branch = false

[tool.coverage.report]
show_missing = true
