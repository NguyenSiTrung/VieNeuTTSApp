# Release pipeline — tag-triggered (fast per-push gates live in ci.yml).
#
#   git tag v0.1.0 && git push origin v0.1.0   → tests + build + verify + publish
#   gh workflow run Release                    → same, but stops before publishing
#
# Per OS: quality gates → full test suite (offscreen Qt) → PyInstaller one-dir
# build (packaging/vienetts-app.spec) → REAL synthesis through the packaged
# binary (--smoke; models fetched once into a cached HF_HOME) → WAV validated
# by scripts/check_smoke_wav.py → artifact (zip / dmg) uploaded. A v* tag then
# collects all three artifacts into a GitHub Release, preferring a curated
# note from packaging/release-notes/<tag>.md (falling back to GitHub's
# auto-generated commit list when that file is absent).
#
# Notes:
# - macOS is arm64-only: GitHub has no Intel mac runners and the native wheels
#   (onnxruntime, kaldi-native-fbank) cannot be cross-frozen. The .app gets an
#   ad-hoc signature (no Apple Developer ID configured) — first launch needs
#   the Gatekeeper System Settings → Privacy & Security → "Open Anyway" bypass
#   (right-click → Open stopped working in macOS Sequoia; see README).
# - Ubuntu builds on 22.04 (glibc 2.35) for the oldest still-reasonable target.
# - Models (~750 MB) are NOT bundled: end users get them on first synthesis,
#   CI downloads them once per repo into the shared HF cache entry below.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: ">=6,<7"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: dist/VieNeuTTS/VieNeuTTS.exe
          - os: macos-latest
            platform: macos-arm64
            binary: dist/VieNeuTTS.app/Contents/MacOS/VieNeuTTS
          - os: ubuntu-22.04
            platform: linux-x64
            binary: dist/VieNeuTTS/VieNeuTTS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install headless Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2 libpulse0 libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libgstreamer1.0-0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pyinstaller${{ env.PYINSTALLER_VERSION }}"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (full suite, offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_AUDIO_BACKEND: ffmpeg
        run: pytest -q --ignore=tests/smoke/test_performance_harness.py

      - name: Version stamp
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build frozen app (PyInstaller)
        env:
          # The spec stamps src/vienetts_app/_version.py from this so the
          # frozen app reports the real tag (the update check compares it
          # against the latest GitHub Release; see packaging/vienetts-app.spec).
          VERSION: ${{ env.VERSION }}
        run: >-
          python -m PyInstaller packaging/vienetts-app.spec --noconfirm
          --distpath dist --workpath "$RUNNER_TEMP/pyinstaller-build"

      - name: Restore model cache (Hugging Face)
        id: hf-cache
        uses: actions/cache@v4
        with:
          # Model weights are OS-independent — one entry shared by all 3 jobs.
          path: ${{ runner.temp }}/hf-home
          key: vienetts-hf-models-v1

      - name: Smoke-test the packaged binary (real synthesis)
        # bash on every OS: pwsh parses a leading quoted path as a string
        # literal, and $RUNNER_TEMP only expands in POSIX shells.
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/hf-home
        run: >-
          "${{ matrix.binary }}" --smoke
          -o "$RUNNER_TEMP/smoke.wav"

      - name: Assert frozen version stamp
        # The Settings update card compares the STAMPED version against the
        # latest GitHub Release — a tag without a stamp is a silent lie.
        # --smoke prints "engine: ..." on stdout; the version goes through
        # a dedicated flag-free probe: the frozen binary must report VERSION.
        shell: bash
        run: |
          actual=$("${{ matrix.binary }}" --version 2>/dev/null || true)
          if [[ "$actual" != *"$VERSION"* ]]; then
            echo "frozen --version '$actual' does not contain tag VERSION '$VERSION'"
            exit 1
          fi
      - name: Validate smoke WAV (non-silent speech)
        shell: bash
        run: python scripts/check_smoke_wav.py "$RUNNER_TEMP/smoke.wav"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType directory -Force -Path pack | Out-Null
          Compress-Archive -Path dist/VieNeuTTS `
            -DestinationPath "pack/VieNeuTTS-$env:VERSION-windows-x64.zip"

      - name: Stage Linux desktop integration (menu entry + icons)
        if: runner.os == 'Linux'
        run: |
          stage=dist/VieNeuTTS/share/linux
          mkdir -p "$stage"
          cp packaging/linux/vienetts-app.desktop packaging/linux/install.sh "$stage/"
          chmod +x "$stage/install.sh"
          for png in src/vienetts_app/ui/assets/icons/icon_*.png; do
            size=$(basename "$png" .png); size=${size#icon_}
            mkdir -p "$stage/icons/hicolor/${size}/apps"
            cp "$png" "$stage/icons/hicolor/${size}/apps/vienetts-app.png"
          done

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pack
          (cd dist && zip -rqr "../pack/VieNeuTTS-$VERSION-linux-x64.zip" VieNeuTTS)

      - name: Package artifact (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/VieNeuTTS.app
          mkdir -p pack
          hdiutil create -volname VieNeuTTS -srcfolder dist/VieNeuTTS.app \
            -ov -format UDZO "pack/VieNeuTTS-$VERSION-macos-arm64.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VieNeuTTS-${{ matrix.platform }}
          path: pack/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    # workflow_dispatch runs everything EXCEPT publishing (dry-run mode).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (curated release notes)
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: VieNeuTTS-*
          merge-multiple: true
          path: release-files

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="packaging/release-notes/${TAG}.md"
          title="$TAG"
          args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            args=(--notes-file "$notes")
            title=$(sed -n 's/^## //p' "$notes" | head -n1)
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$title" "${args[@]}" --verify-tag
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            release-files/* --clobber
          echo "## Released artifacts"
          ls -lh release-files/
