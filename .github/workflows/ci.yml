# Per-push CI — fast quality gates on main and pull requests.
#
# The dev machine is macOS; without this, Windows/Linux regressions only
# surface on release day (the Release workflow runs on v* tags). Lint runs
# standalone; the unit and smoke suites run as parallel matrix jobs so the
# wall time is the slower of the two, not their sum (offscreen Qt). The
# heavy PyInstaller build + real-synthesis smoke matrix stays tag-triggered
# in release.yml. Feature-branch pushes are intentionally excluded to cut
# noise — open a PR (or push to main) for signal.
#
# Ubuntu pins 22.04 to match the release floor (oldest supported glibc and
# the apt package names the release job installs).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

  test:
    name: test (${{ matrix.platform }} · ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            suite: unit
          - os: ubuntu-22.04
            platform: linux-x64
            suite: smoke
          - os: windows-latest
            platform: windows-x64
            suite: unit
          - os: windows-latest
            platform: windows-x64
            suite: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install headless Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          # The preinstalled Chrome apt source flakes with Hash Sum mismatches
          # and fails the whole step (exit 100); nothing here needs Chrome.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2 libpulse0 libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libgstreamer1.0-0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The ignore only bites for the smoke suite (the benchmark harness is
      # opt-in) and is a no-op path for the unit suite, so one command serves
      # both matrix legs.
      - name: Test (${{ matrix.suite }}, offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_AUDIO_BACKEND: ffmpeg
        run: pytest tests/${{ matrix.suite }} -q --ignore=tests/smoke/test_performance_harness.py
