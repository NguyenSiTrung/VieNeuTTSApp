<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current audiobook screen, annotated</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f766e}a:hover{color:#115e59}
</style>
</helmet>
<div style="width: 1640px; height: 960px; box-sizing: border-box; padding: 40px 48px; background: #e9edf1; color: #0f172a; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <header style="display: flex; align-items: baseline; gap: 16px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Sách nói (Audiobooks)</h1>
    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #475569">docs/screenshots/audiobook-studio.png · 1120 × 740</span>
  </header>
  <div style="display: flex; gap: 40px; align-items: flex-start">
    <div style="position: relative; width: 1120px; height: 740px; flex-shrink: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,0.12), 0 12px 32px rgba(15,23,42,0.18)">
      <img src="../../../../docs/screenshots/audiobook-studio.png" alt="Current Sách nói screen of VieNeuTTS v0.1.14" style="display: block; width: 1120px; height: 740px">
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="7">
        <div style="{{p.pos}}">{{p.n}}</div>
      </sc-for>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; flex: 1; min-width: 0">
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="7">
        <li style="display: flex; gap: 12px; align-items: flex-start">
          <span style="flex-shrink: 0; width: 26px; height: 26px; border-radius: 13px; background: #c2410c; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <strong style="font-size: 15px">{{p.title}}</strong>
            <span style="font-size: 14px; line-height: 1.5; color: #334155">{{p.body}}</span>
          </div>
        </li>
      </sc-for>
      <li style="margin-top: 8px; padding: 14px 16px; background: #ffffff; border: 1px solid #99d5cc; border-radius: 10px; font-size: 14px; line-height: 1.5; color: #134e4a"><strong>Worth keeping:</strong> the docked player with its waveform. This screen already has the right pattern, and the redesign makes it the shared transport dock.</li>
    </ol>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const pins = [
      [600, 200, 'Library takes a full band', 'Even with one book, the library card holds about 150 px above the book you are working on. A side column would scale to 50 books.'],
      [705, 347, 'A preference among render actions', '“Tự chuyển chương” is a playback setting placed next to Xuất, Studio… and Tạo tất cả.'],
      [720, 418, 'The same voice dropdown again', 'Picking a voice per book is right, but it is the fourth copy of the form-field picker.'],
      [440, 545, 'Chapter list scrolls inside the page', 'The list is capped at 360 px inside the page scroll, so only 2½ chapters are visible here. Wheel events stall at the boundary.'],
      [1048, 521, 'Unlabelled per-row buttons', 'Wide, empty refresh buttons with no text. The status chips (Chờ, Sẵn sàng) are small and low contrast.'],
      [525, 690, 'The reader is hidden behind a toggle', 'Reading along is a core audiobook job. The “Văn bản” toggle should be a visible side panel when there is room.'],
      [730, 690, 'Oversized prev and next buttons', 'Three equal-width blocks with small glyphs. Fixed 44 px icon buttons around a larger play button read faster.']
    ];
    return {
      pins: pins.map((p, i) => ({
        n: i + 1, title: p[2], body: p[3],
        pos: 'position: absolute; left: ' + (p[0] - 14) + 'px; top: ' + (p[1] - 14) + 'px; width: 28px; height: 28px; border-radius: 14px; background: #c2410c; color: #ffffff; border: 2px solid #ffffff; box-sizing: border-box; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.45)'
      }))
    };
  }
}
</script>
</body>
</html>
