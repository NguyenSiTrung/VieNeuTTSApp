[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vienetts-app"
version = "0.1.12"
description = "Cross-platform on-device Vietnamese/English TTS desktop app powered by VieNeu-TTS v3 Turbo"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "VieNeuTTS App contributors" }]
dependencies = [
    "vieneu==3.3.0",
    "PySide6>=6.7",
    "platformdirs>=4",
    "python-docx>=1.1",
    "pypdf>=6",  # MIT (PDF import) — chosen over AGPL PyMuPDF at Phase 0 (spike-report §7)
]

## NOTE: bare `torch==2.8.0` resolves the CPU wheel from PyPI. Source CUDA
## installs must take the cu128 builds from the PyTorch index instead
## (see README "CUDA from source"); `2.8.0+cu128` satisfies these pins.
[project.optional-dependencies]
gpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
]
# Qwen3-TTS support (optional engine pack): the official runtime plus the
# same PyTorch pins as `gpu` (CPU wheel from PyPI; cu128 from the PyTorch
# index per the note above). The default install stays torch-free.
qwen = [
    "qwen-tts",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=4.57.3,<=4.57.6",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[project.scripts]
vienetts-app = "vienetts_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vienetts_app"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".agents", ".beads", "conductor", "scripts/spike", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto"
pythonpath = ["."]
[tool.coverage.run]
source = ["src/vienetts_app"]
branch = false

[tool.coverage.report]
show_missing = true
